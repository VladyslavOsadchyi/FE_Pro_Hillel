<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>FE-PRO_Hillel</title>
   <link rel="stylesheet" href="/style.css">
</head>

<body>
   <div class="slider">
      <div class="slide active">
         <img src="https://images.pexels.com/photos/30599907/pexels-photo-30599907.jpeg" alt="червоне авто">
         <div class="content">
            <h1>Перший слайд</h1>
            <p>Червоне авто</p>
         </div>
      </div>
      <div class="slide">
         <img src="https://images.pexels.com/photos/170811/pexels-photo-170811.jpeg" alt="Синє авто">
         <div class="content">
            <h1>Другий слайд</h1>
            <p>Синє авто</p>
         </div>
      </div>
      <div class="slide">
         <img src="https://images.pexels.com/photos/2365572/pexels-photo-2365572.jpeg" alt="Жовте авто">
         <div class="content">
            <h1>Третій слайд</h1>
            <p>Жовте авто</p>
         </div>
      </div>
      <div class="slider-controls">
         <button class="btn_prev">Prev</button>
         <button class="btn_next">Next</button>
      </div>
      <div class="slider-indicators">
         <button class="dot active"></button>
         <button class="dot"></button>
         <button class="dot"></button>
      </div>
   </div>
   <script src="/script.js"></script>
</body>

</html>
